<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffeef8, #f5d6eb, #e5b9df);
      font-family: 'Fredoka', sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Background Shapes/Balloons */
    .balloon {
      position: absolute;
      bottom: -100px;
      font-size: 2.5rem;
      user-select: none;
      animation: floatUp 8s infinite linear;
      z-index: 1;
      opacity: 0.7;
    }

    .balloon:nth-child(1) { left: 10%; animation-duration: 9s; animation-delay: 0s; }
    .balloon:nth-child(2) { left: 30%; animation-duration: 7s; animation-delay: 2s; }
    .balloon:nth-child(3) { left: 60%; animation-duration: 11s; animation-delay: 1s; }
    .balloon:nth-child(4) { left: 85%; animation-duration: 8s; animation-delay: 3s; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) rotate(20deg);
        opacity: 0;
      }
    }

    /* Main Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 40px 25px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(220, 100, 170, 0.25);
      position: relative;
      z-index: 2;
      border: 2px solid rgba(255, 255, 255, 0.8);
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .badge {
      display: inline-block;
      background: #ffe3ec;
      color: #e63946;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cake-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 10px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #d81b60;
      font-size: 2.5rem;
      line-height: 1.2;
      margin-bottom: 8px;
      word-wrap: break-word;
    }

    .name {
      color: #8e24aa;
    }

    p {
      color: #555;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 15px 0 25px 0;
    }

    /* Action Buttons */
    .btn-celebrate {
      background: linear-gradient(135deg, #ff4081, #e91e63, #9c27b0);
      color: white;
      border: none;
      outline: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
      transition: all 0.2s ease-in-out;
      width: 100%;
      max-width: 250px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-celebrate:active {
      transform: scale(0.96);
      box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
    }

    /* Footer message */
    .footer-note {
      font-size: 0.85rem;
      color: #888;
      margin-top: 25px;
    }

    /* Small screens tweak */
    @media (max-width: 360px) {
      h1 {
        font-size: 2rem;
      }
      .card {
        padding: 30px 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating balloon emojis in background -->
  <div class="balloon">🎈</div>
  <div class="balloon">✨</div>
  <div class="balloon">🎉</div>
  <div class="balloon">🎈</div>

  <main class="card">
    <span class="badge">Special Day</span>
    <span class="cake-icon">🎂</span>
    
    <!-- You can change the recipient's name here -->
    <h1>Happy Birthday,<br><span class="name">Bestie!</span></h1>
    
    <p>
      May your day be filled with lots of love, laughter, endless happiness, and delicious cake! 🥳
    </p>

    <button class="btn-celebrate" id="celebrateBtn" onclick="triggerParty()">
      🎉 Celebrate!
    </button>

    <div class="footer-note">
      Tap the button for more confetti!
    </div>
  </main>

  <script>
    // Trigger confetti on initial page load
    window.addEventListener('load', () => {
      runFullConfetti();
    });

    // Button click action
    function triggerParty() {
      // Haptic feedback for supported mobile devices
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
      runFullConfetti();
    }

    // Comprehensive confetti burst (works great on mobile and desktop)
    function runFullConfetti() {
      // Side cannons
      confetti({
        particleCount: 60,
        angle: 60,
        spread: 55,
        origin: { x: 0, y: 0.7 }
      });
      confetti({
        particleCount: 60,
        angle: 120,
        spread: 55,
        origin: { x: 1, y: 0.7 }
      });

      // Center burst
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
